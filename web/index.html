<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SignalCore</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/app.css" data-inline>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="9" cy="10" r="6.5" fill="none" stroke="#B39CFF" stroke-width="2"/><circle cx="17" cy="10" r="6.5" fill="none" stroke="#45C1E6" stroke-width="2"/><circle cx="13" cy="17" r="6.5" fill="none" stroke="#F0B445" stroke-width="2"/></svg>
      <span>SignalCore</span><small>KEYSTONE DIRECTORY · DEMO TENANT</small>
    </div>
    <nav class="tabs" aria-label="Views">
      <a href="#prioritize">Prioritize</a>
      <a href="#triangulation">Triangulation</a>
      <a href="#risks">Risks</a>
      <a href="#dependencies">Dependencies</a>
      <a href="#cab">CAB notes</a>
      <a href="#pbr">PBRs</a>
      <a href="#executive">Executive</a>
      <a href="#ask">Ask</a>
      <a href="#run">Run &amp; evals</a>
      <a href="#method">Method</a>
    </nav>
    <div class="runinfo" id="runinfo"></div>
  </div>
</header>
<main class="wrap" id="main">
  <div class="empty" id="loading">Loading evidence…</div>
  <section class="view" data-view="prioritize" hidden></section>
  <section class="view" data-view="triangulation" hidden></section>
  <section class="view" data-view="risks" hidden></section>
  <section class="view" data-view="dependencies" hidden></section>
  <section class="view" data-view="cab" hidden></section>
  <section class="view" data-view="pbr" hidden></section>
  <section class="view" data-view="executive" hidden></section>
  <section class="view" data-view="ask" hidden></section>
  <section class="view" data-view="run" hidden></section>
  <section class="view" data-view="method" hidden></section>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="/static/app.js" data-inline></script>
</body>
</html>
